# Wired interface
WIRE_INT=enp2s0

# Wireless interface
WIFI_INT=wlo1

# Default WiFi connection (SSID) used by `net wifi c` when none is given
WIFI_CON=hidden2

# Base directory for the script and its connections/*.conf files
NET_HOME=/net

# Subdirectory under NET_HOME holding wpa_supplicant configs
CONNECTIONS=connections

# IP used to test basic connectivity
TEST_IP=1.1.1.1

# VPN tunnel interface checked by `net status` to detect an active VPN
VPN_INT=tnet0

# Command run by `net vpn c` to bring the VPN up
VPN_CONNECT_COMMAND="tun c"

# Command run by `net vpn d` to tear the VPN down
VPN_DISCONNECT_COMMAND="tun d"

# Toggle MAC randomization on connect (1=on, 0=off)
USE_MACCHANGER=0
