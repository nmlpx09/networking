# net script configuration
# sourced by the `net` script on startup.
# install to /net/net.conf (or set NET_CONF to point elsewhere).
# any variable left unset here falls back to the script's built-in default.

# Wired interface
WIRE_INT=enp2s0

# Wireless interface
WIFI_INT=wlo1

# Default WiFi connection (SSID) used by `net wifi c` when none is given
WIFI_CON=hidden2

# Base directory for the script and its connections/*.conf files
NET_HOME=/net

# Subdirectory under NET_HOME holding wpa_supplicant configs
CONNECTIONS=connections

# IP used to test basic connectivity
TEST_IP=1.1.1.1

# Expected first-hop gateway IP when VPN is active
VPN_IP=10.0.3.1

# Toggle MAC randomization on connect (1=on, 0=off)
USE_MACCHANGER=0
